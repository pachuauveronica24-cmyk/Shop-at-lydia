<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Shop at Lydia</title><style>body{font-family:system-ui;background:#fff0f5;padding:20px}.box{background:white;padding:22px;border-radius:16px;max-width:480px;margin:30px auto;box-shadow:0 6px 20px rgba(0,0,0,.08)}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#ff2d78;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}</style></head><body><div class="box" id="b1"><h2>Admin Login</h2><p>Password: lydia123</p><input id="pw" type="password" placeholder="Password"><button onclick="if(document.getElementById('pw').value==='lydia123'){b1.style.display='none';b2.style.display='block';load()}else alert('Password dik lo!')">Login</button></div><div class="box" id="b2" style="display:none"><h2>Add Product</h2><input id="n" placeholder="Hming - ex: Kawr Mawi"><input id="p" placeholder="Man - ex: ₹1500"><input id="i" placeholder="Thlalak Link (optional)"><button onclick="add()">Add Product</button><div id="l" style="margin-top:15px"></div><br><a href="index.html">← Shop ah kir</a></div><script>let prods=JSON.parse(localStorage.getItem('lydiaProds')||'[]');function load(){let L=document.getElementById('l');L.innerHTML='<h3>Products:</h3>';prods.forEach((x,i)=>{L.innerHTML+=`<div style='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee'><span>${x.name} - ${x.price}</span><button onclick='del(${i})' style='width:auto;padding:4px 10px;background:red'>X</button></div>`})}function add(){let n=document.getElementById('n').value.trim(),pr=document.getElementById('p').value.trim(),im=document.getElementById('i').value.trim();if(!n||!pr)return alert('Hming leh man ziak rawh!');prods.push({name:n,price:pr,img:im||'https://images.unsplash.com/photo-1525507119028-edfd314fea60?w=500'});localStorage.setItem('lydiaProds',JSON.stringify(prods));document.getElementById('n').value='';document.getElementById('p').value='';document.getElementById('i').value='';load();alert('Add a ni ta!')}function del(i){if(confirm('Delete duh em?')){prods.splice(i,1);localStorage.setItem('lydiaProds',JSON.stringify(prods));load()}}</script></body></html>
